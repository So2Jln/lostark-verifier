name: LostArk Verifier CI/CD 파이프라인

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: Java JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 그레이들 빌드 실행
        run: |
          chmod +x ./gradlew
          ./gradlew clean build -x test

      - name: 도커 허브 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 도커 이미지 빌드 및 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/lostark-verifier:latest

      - name: AWS EC2 서버 배포
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker stop lostark-app || true
            sudo docker rm lostark-app || true
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/lostark-verifier:latest
            sudo docker run -d -p 8080:8080 --name lostark-app ${{ secrets.DOCKER_USERNAME }}/lostark-verifier:latest

